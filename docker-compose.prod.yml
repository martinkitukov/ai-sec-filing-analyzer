version: '3.8'

services:
  sec-analyzer-prod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sec-analyzer-prod
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - VECTOR_DB_PATH=/tmp/chroma_db
      - CHUNK_SIZE=1000
      - CHUNK_OVERLAP=200
      - MAX_CHUNKS=100
      - REQUEST_TIMEOUT=60
      - GEMINI_MODEL=gemini-2.5-flash
      - HF_MODEL_NAME=sentence-transformers/all-MiniLM-L6-v2
    networks:
      - sec-analyzer-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'

  # Nginx reverse proxy for production
  nginx-prod:
    image: nginx:alpine
    container_name: sec-analyzer-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    networks:
      - sec-analyzer-network
    depends_on:
      - sec-analyzer-prod
    restart: unless-stopped
    profiles:
      - nginx

networks:
  sec-analyzer-network:
    driver: bridge 