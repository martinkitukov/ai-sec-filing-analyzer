version: '3.8'

services:
  sec-analyzer-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: sec-analyzer-dev
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - VECTOR_DB_PATH=/tmp/chroma_db  # Use temp directory for ephemeral storage
      - CHUNK_SIZE=1000
      - CHUNK_OVERLAP=200
      - MAX_CHUNKS=100
      - REQUEST_TIMEOUT=60
      - GEMINI_MODEL=gemini-2.5-flash
      - HF_MODEL_NAME=sentence-transformers/all-MiniLM-L6-v2
    volumes:
      # Mount source code for hot reload (only what's needed)
      - ./backend:/app/backend
    networks:
      - sec-analyzer-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Lightweight nginx for frontend serving
  nginx-dev:
    image: nginx:alpine
    container_name: sec-analyzer-nginx-dev
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - sec-analyzer-network
    depends_on:
      - sec-analyzer-dev
    restart: unless-stopped
    profiles:
      - frontend

networks:
  sec-analyzer-network:
    driver: bridge 